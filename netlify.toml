[build]
  command = "npm run build"
  publish = "build"

# Scheduled + custom functions live here; SvelteKit's own server function is generated at build time.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
